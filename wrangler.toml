name = "healthtrack"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "healthtrack"
# 배포 전에 `npx wrangler d1 create healthtrack` 결과의 database_id로 바꿉니다.
database_id = "00000000-0000-0000-0000-000000000000"
